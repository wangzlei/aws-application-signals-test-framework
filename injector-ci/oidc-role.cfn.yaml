AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC role for the Injector E2E CI on the user's forks (trusts repo:<GitHubOwner>/* only). NOT
  deployed by the CI; deploy manually after review.
Parameters:
  GitHubOwner:
    Type: String
    Default: wangzlei
    Description: Only workflows of repositories owned by this GitHub user/org can assume the role
  ClusterName:
    Type: String
    Default: guard-test
  ClusterRegion:
    Type: String
    Default: us-east-2
  EcrRepositoryName:
    Type: String
    Default: guard-test
  EcrRegion:
    Type: String
    Default: us-west-2
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: ARN of an existing token.actions.githubusercontent.com provider; empty = create one
  CreateClusterAccessEntry:
    Type: String
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
    Description: Create an EKS access entry (cluster admin) for the role; requires the cluster's authentication mode API or
      API_AND_CONFIG_MAP, and the stack must be deployed in ClusterRegion
Conditions:
  CreateOidcProvider:
    Fn::Equals:
    - Ref: ExistingOidcProviderArn
    - ''
  CreateAccessEntry:
    Fn::Equals:
    - Ref: CreateClusterAccessEntry
    - 'true'
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
      - sts.amazonaws.com
      ThumbprintList:
      - 6938fd4d98bab03faadb97b34396831e3780aea1
  InjectorCiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: injector-ci-github-actions
      Description: Assumed by the Injector E2E CI workflows on the user's GitHub forks
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: sts:AssumeRoleWithWebIdentity
          Principal:
            Federated:
              Fn::If:
              - CreateOidcProvider
              - Ref: GitHubOidcProvider
              - Ref: ExistingOidcProviderArn
          Condition:
            StringEquals:
              token.actions.githubusercontent.com:aud: sts.amazonaws.com
            StringLike:
              token.actions.githubusercontent.com:sub:
                Fn::Sub: repo:${GitHubOwner}/*
      Policies:
      - PolicyName: injector-ci
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: EcrLogin
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EcrPushPullTestImages
            Effect: Allow
            Action:
            - ecr:BatchCheckLayerAvailability
            - ecr:BatchGetImage
            - ecr:GetDownloadUrlForLayer
            - ecr:InitiateLayerUpload
            - ecr:UploadLayerPart
            - ecr:CompleteLayerUpload
            - ecr:PutImage
            - ecr:DescribeImages
            Resource:
              Fn::Sub: arn:aws:ecr:${EcrRegion}:${AWS::AccountId}:repository/${EcrRepositoryName}
          - Sid: EksClusterAccess
            Effect: Allow
            Action: eks:DescribeCluster
            Resource:
              Fn::Sub: arn:aws:eks:${ClusterRegion}:${AWS::AccountId}:cluster/${ClusterName}
          - Sid: EksctlIamServiceAccountStacks
            Effect: Allow
            Action:
            - cloudformation:CreateStack
            - cloudformation:DeleteStack
            - cloudformation:DescribeStacks
            - cloudformation:DescribeStackEvents
            - cloudformation:DescribeStackResources
            - cloudformation:GetTemplate
            Resource:
              Fn::Sub: arn:aws:cloudformation:${ClusterRegion}:${AWS::AccountId}:stack/eksctl-${ClusterName}-addon-iamserviceaccount-*/*
          - Sid: EksctlListStacks
            Effect: Allow
            Action: cloudformation:ListStacks
            Resource: '*'
          - Sid: IrsaRolesForTestServiceAccounts
            Effect: Allow
            Action:
            - iam:CreateRole
            - iam:DeleteRole
            - iam:GetRole
            - iam:TagRole
            - iam:UntagRole
            - iam:ListAttachedRolePolicies
            - iam:ListRolePolicies
            - iam:UpdateAssumeRolePolicy
            Resource:
            - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/eks-s3-access-*
            - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/eksctl-${ClusterName}-addon-iamserviceaccount-*
          - Sid: IrsaRolePolicyAttachmentOnlyTheseManagedPolicies
            Effect: Allow
            Action:
            - iam:AttachRolePolicy
            - iam:DetachRolePolicy
            Resource:
            - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/eks-s3-access-*
            - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/eksctl-${ClusterName}-addon-iamserviceaccount-*
            Condition:
              ArnEquals:
                iam:PolicyARN:
                - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
                - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
                - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
          - Sid: EksctlReadsTheClusterOidcProvider
            Effect: Allow
            Action:
            - iam:GetOpenIDConnectProvider
            - iam:ListOpenIDConnectProviders
            Resource: '*'
          - Sid: ApplicationSignalsServiceLinkedRole
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource:
              Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/aws-service-role/application-signals.cloudwatch.amazonaws.com/*
            Condition:
              StringEquals:
                iam:AWSServiceName: application-signals.cloudwatch.amazonaws.com
          - Sid: ValidatorReadsTelemetry
            Effect: Allow
            Action:
            - cloudwatch:GetMetricData
            - cloudwatch:GetMetricStatistics
            - cloudwatch:ListMetrics
            - xray:GetTraceSummaries
            - xray:BatchGetTraces
            Resource: '*'
          - Sid: ValidatorReadsApplicationSignalsLogs
            Effect: Allow
            Action:
            - logs:FilterLogEvents
            - logs:GetLogEvents
            - logs:DescribeLogStreams
            Resource:
            - Fn::Sub: arn:aws:logs:${ClusterRegion}:${AWS::AccountId}:log-group:/aws/application-signals/data
            - Fn::Sub: arn:aws:logs:${ClusterRegion}:${AWS::AccountId}:log-group:/aws/application-signals/data:*
      Tags:
      - Key: purpose
        Value: guard-test
  ClusterAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: CreateAccessEntry
    Properties:
      ClusterName:
        Ref: ClusterName
      PrincipalArn:
        Fn::GetAtt:
        - InjectorCiRole
        - Arn
      AccessPolicies:
      - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
        AccessScope:
          Type: cluster
Outputs:
  RoleArn:
    Value:
      Fn::GetAtt:
      - InjectorCiRole
      - Arn
    Description: Put this into the fork's INJECTOR_CI_ROLE_ARN secret
